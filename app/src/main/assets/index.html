<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أهلاً وسهلاً بكم في عيادتنا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #0f172a; color: #f8fafc; overflow: hidden; }

        .radar-pulse { animation: radar 2s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes radar { 0% { transform: scale(0.5); opacity: 0.8; } 100% { transform: scale(3.5); opacity: 0; } }

        .welcome-pulse { animation: pulse 3s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center">

    <div class="relative flex items-center justify-center mb-16">
        <div class="absolute w-20 h-20 bg-emerald-500 rounded-full radar-pulse"></div>
        <div class="absolute w-20 h-20 bg-emerald-400 rounded-full radar-pulse" style="animation-delay: 0.6s"></div>
        <div class="absolute w-20 h-20 bg-emerald-300 rounded-full radar-pulse" style="animation-delay: 1.2s"></div>

        <div class="relative bg-slate-950 w-28 h-28 rounded-full flex items-center justify-center shadow-2xl border-4 border-slate-800 z-10 text-6xl shadow-emerald-500/20">
            🏥
        </div>
    </div>

    <div class="text-center px-12 select-none welcome-pulse">
        <h1 class="text-5xl font-black text-white mb-6 tracking-tight leading-tight">
            أهلاً وسهلاً بكم في عيادتنا
        </h1>
        <p class="text-slate-400 font-bold text-2xl tracking-wide max-w-3xl leading-relaxed">
            نتمنى لكم وقتاً مريحاً ودوام الصحة والعافية.<br>
            <span class="text-slate-500 text-lg font-medium">(جاري تجهيز شاشة الدور...)</span>
        </p>
    </div>

    <script>
        const SERVER_PORT = 3000;
        const TARGET_FILE = "/logo.png";
        const SUBNETS = ['192.168.1', '192.168.0', '192.168.8', '10.0.0'];
        let serverFound = false;

        function checkIP(ip) {
            return new Promise((resolve) => {
                if (serverFound) return resolve();
                const img = new Image();
                const testUrl = `http://${ip}:${SERVER_PORT}`;
                img.onload = () => {
                    if (!serverFound) {
                        serverFound = true;
                        setTimeout(() => { window.location.href = `${testUrl}/tv.html`; }, 800);
                    }
                    resolve();
                };
                img.onerror = () => resolve();
                img.src = `${testUrl}${TARGET_FILE}?rand=${Math.random()}`;
                setTimeout(() => { img.src = ""; resolve(); }, 1500);
            });
        }

        async function scanNetwork() {
            serverFound = false;
            const scanPromises = [];
            for (let subnet of SUBNETS) {
                for (let i = 1; i <= 254; i++) {
                    if (serverFound) break;
                    scanPromises.push(checkIP(`${subnet}.${i}`));
                }
            }
            await Promise.all(scanPromises);

            // ✅ إعادة البحث تلقائياً وبصمت بعد 10 ثوانٍ — لا نهائي
            if (!serverFound) {
                setTimeout(scanNetwork, 10000);
            }
        }

        window.onload = () => { setTimeout(scanNetwork, 1000); };
    </script>
</body>
</html>
